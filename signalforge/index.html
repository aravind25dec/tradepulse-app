<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SignalForge</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #1c2333; --border: #30363d;
    --text: #e6edf3; --text2: #8b949e;
    --green: #3fb950; --green-dim: #1a3a24;
    --red: #f85149; --red-dim: #3a1a1a;
    --yellow: #d29922; --yellow-dim: #3a2e10;
    --blue: #58a6ff;
    --font: 'SF Mono','Fira Code','Cascadia Code',monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; min-height: 100vh; }
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 24px; }
  .logo { font-size: 18px; font-weight: 700; }
  .logo-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] {
    flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 6px; font-family: var(--font); font-size: 14px; text-transform: uppercase;
  }
  button {
    background: var(--blue); color: #fff; border: none; padding: 10px 20px;
    border-radius: 6px; font-family: var(--font); font-weight: 700; cursor: pointer; font-size: 13px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; margin-bottom: 16px;
  }
  .signal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .signal { font-size: 22px; font-weight: 800; padding: 4px 14px; border-radius: 6px; }
  .signal.BUY  { background: var(--green-dim); color: var(--green); }
  .signal.SELL { background: var(--red-dim);   color: var(--red); }
  .signal.HOLD { background: var(--yellow-dim);color: var(--yellow); }
  .confidence { text-align: right; }
  .confidence .pct { font-size: 20px; font-weight: 700; }
  .confidence .label { font-size: 11px; color: var(--text2); }
  .backtest-note {
    font-size: 11px; color: var(--text2); padding: 10px; background: var(--bg3);
    border-radius: 6px; margin-bottom: 14px; line-height: 1.5;
  }
  .narrative { line-height: 1.6; margin-bottom: 14px; }
  .section-title { font-size: 11px; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; letter-spacing: 0.5px; }
  .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 12px; }
  .feature-grid div { background: var(--bg3); padding: 8px; border-radius: 4px; }
  .feature-grid .k { color: var(--text2); font-size: 10px; text-transform: uppercase; }
  .error { color: var(--red); padding: 16px; }
  .disclaimer { font-size: 11px; color: var(--text2); text-align: center; margin-top: 24px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="logo">⚒ SignalForge</div>
  <div class="logo-sub">Locally-trained model + Claude Code live context — never a hardcoded accuracy claim</div>
</header>
<main>
  <div class="search-row">
    <input type="text" id="ticker" placeholder="TICKER (e.g. NVDA)" />
    <button id="go">Predict</button>
  </div>
  <div id="result"></div>
  <div class="disclaimer">
    Educational project. Not financial advice. Confidence and backtested-accuracy numbers come from
    real out-of-sample walk-forward backtests (see /api/models) — no accuracy figure here is ever hardcoded.
  </div>
</main>
<script>
const resultEl = document.getElementById('result');
const tickerEl = document.getElementById('ticker');
const goBtn = document.getElementById('go');

function fmtPct(x) { return x == null ? 'n/a' : (x * 100).toFixed(0) + '%'; }

async function runPredict() {
  const ticker = tickerEl.value.trim().toUpperCase();
  if (!ticker) return;
  goBtn.disabled = true;
  resultEl.innerHTML = '<div class="card">Running prediction — fetching data, scoring model, calling Claude Code CLI for live context…</div>';
  try {
    const resp = await fetch(`/api/predict?ticker=${encodeURIComponent(ticker)}`);
    const data = await resp.json();
    if (!resp.ok) {
      resultEl.innerHTML = `<div class="card error">${data.error || 'Prediction failed'}</div>`;
      return;
    }
    render(data);
  } catch (e) {
    resultEl.innerHTML = `<div class="card error">${e}</div>`;
  } finally {
    goBtn.disabled = false;
  }
}

function render(d) {
  const bt = d.backtested_accuracy || {};
  const feat = d.features || {};
  const live = d.live_context || {};
  resultEl.innerHTML = `
    <div class="card">
      <div class="signal-row">
        <div class="signal ${d.signal}">${d.ticker} — ${d.signal}</div>
        <div class="confidence">
          <div class="pct">${fmtPct(d.confidence)}</div>
          <div class="label">model confidence</div>
        </div>
      </div>
      <div class="backtest-note">
        Backtested overall accuracy: <b>${fmtPct(bt.overall)}</b> ·
        Historical accuracy at this confidence level: <b>${fmtPct(bt.for_this_confidence_level)}</b>
        (test window ${bt.test_date_range ? bt.test_date_range.join(' → ') : 'n/a'}) · model ${d.model_version || 'n/a'}
      </div>
      <div class="narrative">${d.narrative || ''}</div>
      <div class="section-title">Live context (Claude Code CLI)</div>
      <div class="feature-grid" style="margin-bottom:14px">
        <div><div class="k">Sentiment</div>${live.sentiment || 'n/a'}</div>
        <div><div class="k">Current price</div>${live.current_price ?? 'n/a'}</div>
        <div><div class="k">Available</div>${live.available ? 'yes' : 'no'}</div>
      </div>
      <div class="section-title">Model features</div>
      <div class="feature-grid">
        <div><div class="k">RSI</div>${(feat.rsi ?? 0).toFixed(1)}</div>
        <div><div class="k">vs SMA50</div>${((feat.price_to_sma50 ?? 0) * 100).toFixed(1)}%</div>
        <div><div class="k">vs SMA200</div>${((feat.price_to_sma200 ?? 0) * 100).toFixed(1)}%</div>
        <div><div class="k">MACD</div>${feat.macd_bullish ? 'bullish' : 'bearish'}</div>
        <div><div class="k">Vol ratio</div>${(feat.vol_ratio ?? 0).toFixed(2)}x</div>
        <div><div class="k">BB %</div>${((feat.bb_pct ?? 0) * 100).toFixed(0)}%</div>
      </div>
    </div>
  `;
}

goBtn.addEventListener('click', runPredict);
tickerEl.addEventListener('keydown', e => { if (e.key === 'Enter') runPredict(); });
</script>
</body>
</html>
