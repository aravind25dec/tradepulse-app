<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradePulse · My Picks</title>
  <style>
    :root {
      --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--border:#30363d;
      --text:#e6edf3;--text2:#8b949e;
      --green:#3fb950;--green-dim:#1a3a24;
      --red:#f85149;--red-dim:#3a1a1a;
      --yellow:#d29922;--yellow-dim:#3a2e10;
      --blue:#58a6ff;--blue-dim:#0d1f3c;
      --purple:#bc8cff;--purple-dim:#1e1a2e;
      --orange:#f0883e;
      --font:'SF Mono','Fira Code','Cascadia Code',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;min-height:100vh;}

    /* ── Header ── */
    header{background:var(--bg2);border-bottom:1px solid var(--border);
           padding:12px 24px;display:flex;align-items:center;justify-content:space-between;
           position:sticky;top:0;z-index:100;}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
    .logo-icon{font-size:20px;}.logo-text{font-size:15px;font-weight:700;}
    .logo-sub{font-size:10px;color:var(--text2);}
    .header-right{display:flex;align-items:center;gap:10px;}
    nav a{padding:5px 12px;border-radius:6px;text-decoration:none;color:var(--text2);
          font-size:12px;font-weight:600;border:1px solid transparent;transition:all .15s;}
    nav a:hover{color:var(--text);background:var(--bg3);border-color:var(--border);}
    nav a.active{color:var(--blue);background:var(--blue-dim);border-color:var(--blue);}

    /* ── Setup / error notice ── */
    #setup-panel{max-width:500px;margin:60px auto;padding:28px 32px;
                 background:var(--bg2);border:1px solid var(--border);border-radius:12px;display:none;}
    .notice-icon{font-size:28px;margin-bottom:12px;}
    .notice-title{font-size:15px;font-weight:700;margin-bottom:8px;}
    .notice-body{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:16px;}
    .notice-body code{background:var(--bg3);border:1px solid var(--border);border-radius:4px;
                      padding:1px 6px;color:var(--text);}
    .btn-retry{padding:8px 20px;border-radius:8px;border:1px solid var(--blue);
               color:var(--blue);background:var(--blue-dim);font-family:var(--font);
               font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
    .btn-retry:hover{background:var(--blue);color:#000;}

    /* ── Fetching-positions loader ── */
    #fetch-panel{display:none;max-width:440px;margin:80px auto;text-align:center;color:var(--text2);}
    .fetch-spinner{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--purple);
                   border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 18px;}
    .fetch-label{font-size:13px;color:var(--text2);}
    .fetch-sub{font-size:11px;color:var(--text2);margin-top:6px;opacity:.7;}

    /* ── Controls bar ── */
    #controls{background:var(--bg3);border-bottom:1px solid var(--border);
              padding:10px 24px;display:none;align-items:center;gap:12px;flex-wrap:wrap;}
    .label{font-size:11px;color:var(--text2);}
    .acct-pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;
               background:var(--bg);border:1px solid var(--border);color:var(--text2);
               cursor:pointer;transition:all .15s;}
    .acct-pill.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}
    .gap{flex:1;}
    #summary-line{font-size:11px;color:var(--text2);}
    .btn-action{padding:4px 12px;border-radius:6px;border:1px solid var(--border);
                color:var(--text2);background:var(--bg);font-family:var(--font);
                font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;}
    .btn-action:hover{border-color:var(--blue);color:var(--blue);}

    /* ── Grid ── */
    #grid-section{padding:24px;display:none;}
    .picks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}

    /* ── Card styles (identical to index.html) ── */
    .pick-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
               overflow:hidden;transition:border-color .15s,transform .1s;cursor:pointer;}
    .pick-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 4px 20px rgba(88,166,255,.1);}
    .pick-card.grade-STRONG-BUY{border-top:3px solid var(--green);}
    .pick-card.grade-BUY       {border-top:3px solid #6ee77a;}
    .pick-card.grade-WATCH     {border-top:3px solid var(--yellow);}
    .pick-card.grade-SKIP      {border-top:3px solid var(--red);}

    .card-top{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;}
    .card-ticker{font-size:22px;font-weight:800;letter-spacing:1px;}
    .card-price {font-size:18px;font-weight:700;}
    .card-chg{font-size:12px;margin-top:2px;display:flex;align-items:center;gap:6px;}
    .chg-pos{color:var(--green);}.chg-neg{color:var(--red);}.chg-neu{color:var(--text2);}

    .grade-pill{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap;}
    .pill-STRONG-BUY{background:var(--green-dim);color:var(--green);border:1px solid var(--green);}
    .pill-BUY       {background:#1a2e1a;color:#6ee77a;border:1px solid #2a5a2a;}
    .pill-WATCH     {background:var(--yellow-dim);color:var(--yellow);border:1px solid var(--yellow);}
    .pill-NEUTRAL   {background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
    .pill-SKIP      {background:var(--red-dim);color:var(--red);border:1px solid var(--red);}

    /* ── Position strip (portfolio-specific) ── */
    .pos-strip{margin:0 16px 10px;padding:9px 12px;border-radius:7px;
               background:var(--bg3);border:1px solid var(--border);font-size:11px;}
    .pos-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
    .pos-shares{color:var(--text2);}
    .pos-shares strong{color:var(--text);}
    .pos-acct{font-size:10px;padding:2px 7px;border-radius:4px;
              background:var(--bg);border:1px solid var(--border);color:var(--text2);}
    .pos-pnl{font-size:13px;font-weight:700;}
    .pos-pnl.pos{color:var(--green);}.pos-pnl.neg{color:var(--red);}

    .danger-box{margin:0 16px 10px;padding:7px 12px;border-radius:6px;font-size:10px;font-weight:700;display:flex;align-items:center;gap:6px;}
    .danger-high  {background:var(--red-dim);border:1px solid var(--red);color:var(--red);}
    .danger-medium{background:var(--yellow-dim);border:1px solid var(--yellow);color:var(--yellow);}

    .levels-bar{margin:0 16px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
    .levels-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;}
    .level-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
    .level-val  {font-size:14px;font-weight:700;margin-top:1px;}
    .level-dividers{display:flex;gap:4px;align-items:center;margin-top:8px;flex-wrap:wrap;}
    .rr-badge    {font-size:10px;font-weight:700;color:var(--orange);background:#2e1e0e;border:1px solid var(--orange);padding:2px 7px;border-radius:4px;}
    .horizon-badge{font-size:10px;color:var(--text2);background:var(--bg);border:1px solid var(--border);padding:2px 7px;border-radius:4px;}
    .conv-badge  {font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;}
    .conv-high   {color:var(--green);background:var(--green-dim);border:1px solid var(--green);}
    .conv-medium {color:var(--yellow);background:var(--yellow-dim);border:1px solid var(--yellow);}
    .conv-low,.conv-none{color:var(--text2);background:var(--bg);border:1px solid var(--border);}

    .chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 16px 10px;}
    .chip{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--text2);}
    .chip.bull{background:#1a2e1a;color:#6ee77a;border-color:#2a5a2a;}
    .chip.bear{background:var(--red-dim);color:#f08080;border-color:#4a2a2a;}
    .chip.warn{background:var(--yellow-dim);color:var(--yellow);border-color:#5a4010;}

    .analysis-box{margin:0 16px 12px;padding:9px 12px;border-radius:6px;
                  background:var(--bg);border:1px solid var(--border);font-size:11px;color:var(--text2);line-height:1.5;}
    .ai-label{font-size:9px;font-weight:700;margin-bottom:3px;display:block;}
    .ai-label.claude{color:var(--purple);}.ai-label.tech{color:var(--blue);}

    .score-bar-wrap{display:flex;align-items:center;gap:8px;padding:8px 16px;
                    border-top:1px solid var(--border);background:var(--bg3);}
    .score-label{font-size:10px;color:var(--text2);white-space:nowrap;}
    .score-bar-bg{flex:1;background:var(--bg);border-radius:3px;height:5px;}
    .score-bar-fill{height:5px;border-radius:3px;}
    .score-val{font-size:11px;font-weight:700;min-width:38px;text-align:right;}
    .danger-count{font-size:10px;color:var(--text2);background:var(--bg);border:1px solid var(--border);padding:1px 6px;border-radius:4px;}
    .danger-count.has-danger{color:var(--red);border-color:var(--red);background:var(--red-dim);}

    /* ── Skeleton ── */
    .pick-card.skeleton{cursor:default;}
    .pick-card.skeleton:hover{transform:none;border-color:var(--border);}
    .skel-line{background:var(--bg3);border-radius:4px;animation:shimmer 1.4s ease infinite;}
    @keyframes shimmer{0%,100%{opacity:.4}50%{opacity:.9}}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Modal ── */
    #modal-overlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.8);
                   backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;
                   padding:24px 16px;overflow-y:auto;}
    #modal-overlay.open{display:flex;}
    .modal-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;
                width:100%;max-width:780px;position:relative;box-shadow:0 24px 80px rgba(0,0,0,.7);
                animation:slideUp .2s ease;}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .modal-close-btn{position:absolute;top:14px;right:14px;background:var(--bg3);
                     border:1px solid var(--border);color:var(--text2);font-family:var(--font);
                     font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;}
    .modal-close-btn:hover{border-color:var(--red);color:var(--red);}
    .modal-section{padding:18px 24px;border-bottom:1px solid var(--border);}
    .modal-section:last-child{border-bottom:none;}
    .modal-section-title{font-size:10px;font-weight:700;text-transform:uppercase;
                         letter-spacing:.8px;color:var(--text2);margin-bottom:12px;}
    .modal-header{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
    .modal-ticker{font-size:28px;font-weight:900;letter-spacing:2px;}
    .modal-price {font-size:22px;font-weight:700;margin-top:4px;}
    .modal-chg   {font-size:13px;color:var(--text2);margin-top:3px;display:flex;gap:10px;}
    .modal-header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
    .modal-score-big{font-size:28px;font-weight:900;}
    .sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
    .sig-item{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:9px 12px;}
    .sig-name{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
    .sig-val {font-size:13px;font-weight:700;margin-top:3px;}
    .sig-sub {font-size:10px;color:var(--text2);margin-top:1px;}
    .sig-bull{color:var(--green);}.sig-bear{color:var(--red);}.sig-neu{color:var(--text2);}
    .reasons-list{display:flex;flex-direction:column;gap:5px;}
    .reason-item{font-size:11px;display:flex;align-items:center;gap:6px;}
    .reason-item::before{content:"›";color:var(--blue);}
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <a class="logo" href="/">
    <span class="logo-icon">⚡</span>
    <div><div class="logo-text">TradePulse</div><div class="logo-sub">My Portfolio Picks</div></div>
  </a>
  <div class="header-right">
    <nav>
      <a href="/">Hot Picks</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/agent">🤖 Agent</a>
      <a href="/my-picks" class="active">My Picks</a>
    </nav>
  </div>
</header>

<!-- ── Setup / error panel ── -->
<div id="setup-panel">
  <div class="notice-icon" id="setup-icon">🔌</div>
  <div class="notice-title" id="setup-title">Setup required</div>
  <div class="notice-body" id="setup-body"></div>
  <button class="btn-retry" onclick="init()">↻ Retry</button>
</div>

<!-- ── Fetching-positions loader ── -->
<div id="fetch-panel">
  <div class="fetch-spinner"></div>
  <div class="fetch-label">Asking Claude to fetch your Robinhood positions…</div>
  <div class="fetch-sub">Claude is calling the Robinhood MCP — this takes ~15–30 seconds</div>
</div>

<!-- ── Controls bar ── -->
<div id="controls">
  <span class="label">Account:</span>
  <div id="acct-pills"></div>
  <span class="gap"></span>
  <span id="summary-line"></span>
  <button class="btn-action" onclick="reAnalyze()">↻ Re-fetch &amp; Analyze</button>
</div>

<!-- ── Tile grid ── -->
<div id="grid-section">
  <div class="picks-grid" id="picks-grid"></div>
</div>

<!-- ── Modal ── -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-card">
    <button class="modal-close-btn" onclick="closeModal()">✕ Close</button>
    <div class="modal-section">
      <div class="modal-header">
        <div>
          <div class="modal-ticker" id="m-ticker">—</div>
          <div class="modal-price"  id="m-price">—</div>
          <div class="modal-chg">
            <span id="m-chg-open">—</span>
            <span id="m-chg-15m">—</span>
          </div>
        </div>
        <div class="modal-header-right">
          <span class="grade-pill" id="m-grade-pill">—</span>
          <span class="modal-score-big" id="m-score-big">—</span>
        </div>
      </div>
    </div>
    <div class="modal-section" id="m-pos-section" style="display:none">
      <div class="modal-section-title">Your Position</div>
      <div id="m-pos-body" style="font-size:12px;color:var(--text2);line-height:1.8"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Signal Details</div>
      <div class="sig-grid" id="m-sig-grid"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Trade Plan</div>
      <div id="m-plan" style="font-size:12px;color:var(--text2);line-height:1.7"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Reasons</div>
      <div class="reasons-list" id="m-reasons"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title" id="m-analysis-label">AI Analysis</div>
      <div id="m-analysis" style="font-size:12px;color:var(--text2);line-height:1.7"></div>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let _positions  = [];
let _analyses   = {};
let _acctFilter = 'ALL';

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt  = n => n == null ? '—' : Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = n => n == null ? '—' : (Math.abs(n)>=1000?(n/1000).toFixed(1)+'k':fmt(n));
const chgClass = v => v > 0 ? 'chg-pos' : v < 0 ? 'chg-neg' : 'chg-neu';
const chgStr   = v => v == null ? '—' : (v>0?'+':'')+v.toFixed(2)+'%';
const scoreColor = s => s>=60?'var(--green)':s>=30?'#6ee77a':s>=0?'var(--yellow)':'var(--red)';
const pillClass  = g => 'pill-'+(g||'NEUTRAL').replace(/ /g,'-');
const gradeClass = g => 'grade-'+(g||'NEUTRAL').replace(/ /g,'-');

function buildChips(sig) {
  const c = [];
  if (sig.rsi!=null) c.push(`<span class="chip ${sig.rsi>70?'bear':sig.rsi<40?'bull':''}">RSI ${sig.rsi.toFixed(0)}</span>`);
  if (sig.macd_signal!=null) c.push(`<span class="chip ${sig.macd_signal>0?'bull':'bear'}">MACD ${sig.macd_signal>0?'▲':'▼'}</span>`);
  if (sig.adx!=null) c.push(`<span class="chip ${sig.adx>25?'bull':''}">ADX ${sig.adx.toFixed(0)}</span>`);
  if (sig.bb_position) c.push(`<span class="chip ${sig.bb_position==='UPPER'?'bear':sig.bb_position==='LOWER'?'bull':''}">BB ${sig.bb_position}</span>`);
  if (sig.vol_ratio!=null) c.push(`<span class="chip ${sig.vol_ratio>=1.5?'bull':sig.vol_ratio<0.8?'bear':''}">Vol ${sig.vol_ratio.toFixed(1)}x</span>`);
  if (sig.ema_cross) c.push(`<span class="chip ${sig.ema_cross==='BULLISH'?'bull':sig.ema_cross==='BEARISH'?'bear':''}">EMA ${sig.ema_cross}</span>`);
  if (sig.vwap_position) c.push(`<span class="chip ${sig.vwap_position==='ABOVE'?'bull':'bear'}">VWAP ${sig.vwap_position}</span>`);
  return c.join('');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('setup-panel').style.display  = 'none';
  document.getElementById('fetch-panel').style.display  = 'none';
  document.getElementById('controls').style.display     = 'none';
  document.getElementById('grid-section').style.display = 'none';

  // 1. Check Claude CLI + MCP availability
  const st = await fetch('/api/agent/status').then(r=>r.json()).catch(()=>({}));
  if (!st.claude_available) {
    showSetup('🔌', 'Claude CLI not found',
      `Install it with:<br><br><code>npm install -g @anthropic-ai/claude-code</code><br><br>
       Then run <code>claude</code> in your terminal once to authenticate, and restart TradePulse.`);
    return;
  }
  if (!st.robinhood_mcp) {
    showSetup('📡', 'Robinhood MCP not configured',
      `Run this once in your terminal to connect Claude to your Robinhood accounts:<br><br>
       <code>claude mcp add robinhood-trading --transport http https://agent.robinhood.com/mcp/trading</code><br><br>
       Then reload this page.`);
    return;
  }

  // 2. Fetch positions via MCP (may take 15–30s)
  document.getElementById('fetch-panel').style.display = '';
  let pd;
  try {
    const r = await fetch('/api/my-picks/positions');
    pd = await r.json();
  } catch(e) {
    document.getElementById('fetch-panel').style.display = 'none';
    showSetup('⚠', 'Network error', e.message);
    return;
  }
  document.getElementById('fetch-panel').style.display = 'none';

  if (pd.error) {
    showSetup('⚠', 'Could not fetch positions', pd.error);
    return;
  }

  _positions = (pd.positions || []).filter(p => parseFloat(p.quantity) > 0);
  if (!_positions.length) {
    showSetup('📭', 'No open positions', 'Claude found no open stock positions in your Robinhood accounts.');
    return;
  }

  // 3. Show grid and kick off parallel analysis
  document.getElementById('controls').style.display     = 'flex';
  document.getElementById('grid-section').style.display = '';
  buildAcctPills();
  renderSkeletons();
  const tickers = [...new Set(_positions.map(p => p.ticker))];
  await Promise.all(tickers.map(analyzeOne));
  renderCards();
  updateSummaryLine();
}

function showSetup(icon, title, body) {
  document.getElementById('setup-icon').textContent  = icon;
  document.getElementById('setup-title').textContent = title;
  document.getElementById('setup-body').innerHTML    = body;
  document.getElementById('setup-panel').style.display = '';
}

async function reAnalyze() {
  _analyses  = {};
  _positions = [];
  await init();
}

// ── Analyze one ticker ─────────────────────────────────────────────────────────
async function analyzeOne(ticker) {
  try {
    const r = await fetch(`/api/hotpicks/analyze?ticker=${encodeURIComponent(ticker)}`);
    _analyses[ticker] = await r.json();
  } catch(_) {
    _analyses[ticker] = { error: 'Analysis failed' };
  }
  _positions.filter(p => p.ticker === ticker).forEach(p => {
    const el = document.getElementById(`card-${p.ticker}-${p.account_number||'main'}`);
    if (el) el.outerHTML = buildCard(p);
  });
  updateSummaryLine();
}

// ── Account filter ─────────────────────────────────────────────────────────────
function buildAcctPills() {
  const seen = {};
  _positions.forEach(p => { seen[p.account_number||'main'] = p.account_label||'Brokerage'; });
  const el = document.getElementById('acct-pills');
  el.innerHTML = `<span class="acct-pill active" onclick="setAcctFilter('ALL',this)">All</span>`;
  Object.entries(seen).forEach(([num,label]) => {
    el.innerHTML += `<span class="acct-pill" onclick="setAcctFilter('${num}',this)">${label}</span>`;
  });
}

function setAcctFilter(acct, el) {
  _acctFilter = acct;
  document.querySelectorAll('.acct-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

const filteredPositions = () => _acctFilter === 'ALL'
  ? _positions
  : _positions.filter(p => (p.account_number||'main') === _acctFilter);

// ── Summary line ───────────────────────────────────────────────────────────────
function updateSummaryLine() {
  const analyzed = Object.keys(_analyses).length;
  const total    = [...new Set(_positions.map(p => p.ticker))].length;
  const totalPnl = _positions.reduce((sum, p) => {
    const price = _analyses[p.ticker]?.signals?.price || 0;
    return sum + (price - parseFloat(p.avg_cost||0)) * parseFloat(p.quantity||0);
  }, 0);
  const pnlStr   = totalPnl >= 0 ? `+$${fmtK(totalPnl)}` : `-$${fmtK(Math.abs(totalPnl))}`;
  const pnlColor = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('summary-line').innerHTML =
    `${_positions.length} positions · ${analyzed}/${total} analyzed · Total P&L: <strong style="color:${pnlColor}">${pnlStr}</strong>`;
}

// ── Skeleton cards ─────────────────────────────────────────────────────────────
function renderSkeletons() {
  document.getElementById('picks-grid').innerHTML = filteredPositions().map(p => {
    const id  = `card-${p.ticker}-${p.account_number||'main'}`;
    const qty = parseFloat(p.quantity||0);
    return `<div class="pick-card skeleton" id="${id}">
      <div class="card-top">
        <div><div class="card-ticker">${p.ticker}</div>
          <div class="card-chg chg-neu">${qty%1===0?qty.toFixed(0):qty.toFixed(4)} shares · avg $${fmt(parseFloat(p.avg_cost||0))}</div>
        </div>
        <div>
          <div class="skel-line" style="width:70px;height:18px;margin-bottom:8px"></div>
          <div class="skel-line" style="width:60px;height:20px"></div>
        </div>
      </div>
      <div style="padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px">
        <div class="skel-line" style="height:12px;width:80%"></div>
        <div class="skel-line" style="height:12px;width:60%"></div>
        <div class="skel-line" style="height:12px;width:70%"></div>
      </div>
    </div>`;
  }).join('');
}

// ── Position strip ─────────────────────────────────────────────────────────────
function positionStrip(pos, livePrice) {
  const qty   = parseFloat(pos.quantity||0);
  const avg   = parseFloat(pos.avg_cost||0);
  const pnl   = livePrice ? (livePrice - avg) * qty : 0;
  const pnlPct = avg > 0 && livePrice ? ((livePrice - avg) / avg * 100) : 0;
  const cls   = pnl >= 0 ? 'pos' : 'neg';
  const sign  = pnl >= 0 ? '+' : '';
  const label = pos.account_label || 'Brokerage';
  const qStr  = qty%1===0 ? qty.toFixed(0) : qty.toFixed(4);
  return `<div class="pos-strip">
    <div class="pos-row">
      <span class="pos-shares"><strong>${qStr}</strong> shares · avg <strong>$${fmt(avg)}</strong></span>
      <span class="pos-acct">${label}</span>
    </div>
    ${livePrice ? `<div class="pos-row" style="margin-top:6px">
      <span style="font-size:10px;color:var(--text2)">Unrealized P&L</span>
      <span class="pos-pnl ${cls}">${sign}$${fmtK(pnl)} (${sign}${pnlPct.toFixed(1)}%)</span>
    </div>` : ''}
  </div>`;
}

// ── Full card builder ──────────────────────────────────────────────────────────
function buildCard(pos) {
  const id = `card-${pos.ticker}-${pos.account_number||'main'}`;
  const a  = _analyses[pos.ticker];
  if (!a || a.error) {
    return `<div class="pick-card" id="${id}">
      <div class="card-top">
        <div><div class="card-ticker">${pos.ticker}</div>
          <div class="card-chg chg-neu">Analysis unavailable</div></div>
      </div>${positionStrip(pos, null)}</div>`;
  }

  const sig    = a.signals    || {};
  const plan   = a.trade_plan || {};
  const sc     = { color: scoreColor(a.score||0), pct: Math.min(100, Math.max(0,(a.score||0)+100)/2) };
  const conv   = plan.conviction || 'low';
  const danger = a.danger || 0;

  let dangerHtml = '';
  if (danger >= 4) dangerHtml = `<div class="danger-box danger-high">⛔ ${danger} DANGER SIGNALS — High reversal risk</div>`;
  else if (danger >= 2) dangerHtml = `<div class="danger-box danger-medium">⚡ ${danger} risk factors — trade with caution</div>`;

  const aiLabel = plan.ai_generated
    ? '<span class="ai-label claude">🤖 Claude AI Analysis</span>'
    : '<span class="ai-label tech">📐 Technical Analysis</span>';

  return `
  <div class="pick-card ${gradeClass(a.grade)}" id="${id}" onclick="openModal('${pos.ticker}','${pos.account_number||''}')">
    <div class="card-top">
      <div>
        <div class="card-ticker">${pos.ticker}</div>
        <div class="card-chg">
          <span class="${chgClass(sig.chg_open)}">${chgStr(sig.chg_open)} open</span>
          <span class="${chgClass(sig.chg_15m)}">${chgStr(sig.chg_15m)} 15m</span>
        </div>
      </div>
      <div style="text-align:right">
        <div class="card-price">$${fmt(sig.price)}</div>
        <div style="margin-top:5px"><span class="grade-pill ${pillClass(a.grade)}">${a.grade||'—'}</span></div>
      </div>
    </div>
    ${positionStrip(pos, sig.price)}
    ${dangerHtml}
    <div class="levels-bar">
      <div class="levels-row">
        <div><div class="level-label">Entry</div><div class="level-val" style="color:var(--blue)">$${fmt(plan.entry)}</div></div>
        <div><div class="level-label">Target</div><div class="level-val" style="color:var(--green)">$${fmt(plan.target)}</div></div>
        <div><div class="level-label">ATR Stop</div><div class="level-val" style="color:var(--red)">$${fmt(plan.stop)}</div></div>
      </div>
      <div class="level-dividers">
        <span class="rr-badge">R:R ${plan.rr||'—'}</span>
        <span class="horizon-badge">⏱ ${plan.horizon||'—'}</span>
        <span class="conv-badge conv-${conv}">${conv.toUpperCase()}</span>
      </div>
    </div>
    <div class="chips">${buildChips(sig)}</div>
    <div class="analysis-box">${aiLabel}${plan.analysis||'No analysis.'}</div>
    <div class="score-bar-wrap">
      <span class="score-label">Score</span>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${sc.pct}%;background:${sc.color}"></div></div>
      <span class="score-val" style="color:${sc.color}">${(a.score||0)>=0?'+':''}${a.score||0}</span>
      <span class="danger-count ${danger>=2?'has-danger':''}">⚠${danger}</span>
    </div>
  </div>`;
}

// ── Render all cards sorted by grade ──────────────────────────────────────────
function renderCards() {
  const fps   = filteredPositions();
  const order = {'STRONG BUY':0,'BUY':1,'WATCH':2,'NEUTRAL':3,'SKIP':4};
  const sorted = [...fps].sort((a,b) => {
    const ga = _analyses[a.ticker]?.grade;
    const gb = _analyses[b.ticker]?.grade;
    if (!ga && !gb) return 0; if (!ga) return 1; if (!gb) return -1;
    return (order[ga]??5) - (order[gb]??5);
  });
  document.getElementById('picks-grid').innerHTML = sorted.map(p => {
    if (!_analyses[p.ticker]) {
      const id = `card-${p.ticker}-${p.account_number||'main'}`;
      return `<div class="pick-card skeleton" id="${id}">
        <div class="card-top">
          <div><div class="card-ticker">${p.ticker}</div><div class="card-chg chg-neu">Analyzing…</div></div>
          <div><div class="skel-line" style="width:60px;height:20px"></div></div>
        </div>${positionStrip(p,null)}</div>`;
    }
    return buildCard(p);
  }).join('');
}

// ── Modal ──────────────────────────────────────────────────────────────────────
function openModal(ticker, acctNum) {
  const a = _analyses[ticker];
  if (!a || a.error) return;
  const sig  = a.signals    || {};
  const plan = a.trade_plan || {};
  const pos  = _positions.find(p => p.ticker===ticker && (acctNum ? p.account_number===acctNum : true));

  document.getElementById('m-ticker').textContent    = ticker;
  document.getElementById('m-price').textContent     = `$${fmt(sig.price)}`;
  document.getElementById('m-chg-open').className    = chgClass(sig.chg_open);
  document.getElementById('m-chg-open').textContent  = chgStr(sig.chg_open)+' open';
  document.getElementById('m-chg-15m').className     = chgClass(sig.chg_15m);
  document.getElementById('m-chg-15m').textContent   = chgStr(sig.chg_15m)+' 15m';
  document.getElementById('m-grade-pill').className  = `grade-pill ${pillClass(a.grade)}`;
  document.getElementById('m-grade-pill').textContent = a.grade||'—';
  const sc = scoreColor(a.score||0);
  document.getElementById('m-score-big').textContent  = `${(a.score||0)>=0?'+':''}${a.score||0}`;
  document.getElementById('m-score-big').style.color  = sc;

  const ps = document.getElementById('m-pos-section');
  if (pos) {
    ps.style.display = '';
    const qty    = parseFloat(pos.quantity||0);
    const avg    = parseFloat(pos.avg_cost||0);
    const price  = sig.price || 0;
    const pnl    = (price - avg) * qty;
    const pnlPct = avg > 0 ? ((price-avg)/avg*100) : 0;
    const pnlColor = pnl >= 0 ? 'var(--green)' : 'var(--red)';
    document.getElementById('m-pos-body').innerHTML =
      `${qty%1===0?qty.toFixed(0):qty.toFixed(4)} shares &nbsp;·&nbsp; avg cost $${fmt(avg)} &nbsp;·&nbsp; ${pos.account_label||'Brokerage'}<br>
       Market value: <strong>$${fmt(price*qty)}</strong> &nbsp;·&nbsp;
       Unrealized P&L: <strong style="color:${pnlColor}">${pnl>=0?'+':''}$${fmtK(pnl)} (${pnlPct>=0?'+':''}${pnlPct.toFixed(1)}%)</strong>`;
  } else { ps.style.display = 'none'; }

  document.getElementById('m-sig-grid').innerHTML = [
    {name:'RSI', val:sig.rsi?.toFixed(1),        sub:sig.rsi>70?'Overbought':sig.rsi<30?'Oversold':'Neutral',  cls:sig.rsi>70?'sig-bear':sig.rsi<40?'sig-bull':'sig-neu'},
    {name:'MACD',val:sig.macd_signal?.toFixed(3), sub:sig.macd_signal>0?'Bullish':'Bearish',                   cls:sig.macd_signal>0?'sig-bull':'sig-bear'},
    {name:'ADX', val:sig.adx?.toFixed(1),         sub:sig.adx>25?'Trending':'Weak',                            cls:sig.adx>25?'sig-bull':'sig-neu'},
    {name:'BB',  val:sig.bb_position,              sub:'Band position',                                         cls:sig.bb_position==='UPPER'?'sig-bear':sig.bb_position==='LOWER'?'sig-bull':'sig-neu'},
    {name:'VWAP',val:sig.vwap_position,            sub:`$${fmt(sig.vwap)}`,                                     cls:sig.vwap_position==='ABOVE'?'sig-bull':'sig-bear'},
    {name:'EMA', val:sig.ema_cross,                sub:`9=$${fmt(sig.ema9)} 21=$${fmt(sig.ema21)}`,            cls:sig.ema_cross==='BULLISH'?'sig-bull':'sig-bear'},
    {name:'Vol', val:sig.vol_ratio?.toFixed(2)+'x',sub:'vs avg volume',                                        cls:sig.vol_ratio>=1.5?'sig-bull':sig.vol_ratio<0.8?'sig-bear':'sig-neu'},
    {name:'ATR%',val:sig.atr_pct?.toFixed(2)+'%', sub:'Daily range',                                           cls:'sig-neu'},
  ].map(s=>`<div class="sig-item"><div class="sig-name">${s.name}</div>
    <div class="sig-val ${s.cls}">${s.val||'—'}</div>
    <div class="sig-sub">${s.sub||''}</div></div>`).join('');

  document.getElementById('m-plan').innerHTML =
    `<strong>Entry:</strong> $${fmt(plan.entry)} &nbsp;·&nbsp;
     <strong>Target:</strong> $${fmt(plan.target)} &nbsp;·&nbsp;
     <strong>Stop:</strong> $${fmt(plan.stop)}<br>
     <strong>R:R</strong> ${plan.rr||'—'} &nbsp;·&nbsp;
     <strong>Horizon:</strong> ${plan.horizon||'—'} &nbsp;·&nbsp;
     <strong>Conviction:</strong> ${(plan.conviction||'—').toUpperCase()}
     ${plan.key_risk?`<div style="margin-top:8px;color:var(--red)">⚠ Key risk: ${plan.key_risk}</div>`:''}`;

  document.getElementById('m-reasons').innerHTML =
    (a.reasons||[]).map(r=>`<div class="reason-item">${r}</div>`).join('') ||
    '<div style="color:var(--text2);font-size:12px">No reasons available.</div>';

  document.getElementById('m-analysis-label').textContent =
    plan.ai_generated ? '🤖 Claude AI Analysis' : '📐 Technical Analysis';
  document.getElementById('m-analysis').innerHTML = plan.analysis || '—';

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay') &&
      !e.target.classList.contains('modal-close-btn')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal({target: document.getElementById('modal-overlay')});
});

init();
</script>
</body>
</html>
